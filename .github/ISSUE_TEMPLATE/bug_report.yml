name: Bug report
description: Report a reproducible problem with the CLI or library.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove tokens and private data before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 22.13, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, sanitized output, and a minimal example.
      render: shell
    validations:
      required: true
