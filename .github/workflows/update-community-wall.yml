name: Update community walls

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-community-walls
  cancel-in-progress: true

jobs:
  update-walls:
    name: Update community walls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Generate followers wall
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node dist/cli.js followers "${{ github.repository_owner }}" \
            --output assets/followers.png \
            --image-size 64 \
            --columns 10 \
            --limit 100

      - name: Generate contributors wall
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node dist/cli.js contributors "${{ github.repository }}" \
            --output assets/contributors.png \
            --image-size 64 \
            --columns 10 \
            --limit 100

      - name: Commit updated walls
        run: |
          git add assets/followers.png assets/contributors.png

          if git diff --cached --quiet; then
            echo "Community walls are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update community walls"
          git push
