name: Update community wall

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-community-wall
  cancel-in-progress: true

jobs:
  update-followers:
    name: Update followers wall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.5.1
          runtime: node@22
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Generate followers wall
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node dist/cli.js followers "${{ github.repository_owner }}" \
            --output assets/followers.png \
            --image-size 64 \
            --columns 10 \
            --limit 100

      - name: Commit updated wall
        run: |
          if git diff --quiet -- assets/followers.png; then
            echo "Community wall is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/followers.png
          git commit -m "chore: update community wall"
          git push
