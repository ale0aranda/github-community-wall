name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and types
        run: pnpm check

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build

      - name: Verify CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js followers --help
